# ~/.config/starship.toml
# ~/.config/starship.toml

add_newline = true
command_timeout = 1000

format = """
$os\
$time\
$directory\
$git_branch\
$git_status\
$fill\
$helm\
$terraform\
$python\
$lua\
$nodejs\
$golang\
$rust\
$package\
$gcloud\
$docker_context\
$jobs\
$cmd_duration\
$line_break\
$character"""

# Drop ugly default prompt characters
[character]
success_symbol = ''
error_symbol = ''

# ---

[os]
format = '[$symbol](bold white) '
disabled = false

[os.symbols]
Windows = ' '
Arch = '󰣇'
Ubuntu = ''
Macos = '󰀵'

# ---y

# Shows the time 
[time]
disabled = false
format = '[$time]($style) '
time_format = "%F %T" # You can also use other strftime format strings to customize.
style = "bold #f6c177" # Rose Pine gold


# Shows current directory
[directory]
style = 'bold #3e8fb0' # Rose Pine pine
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = false
home_symbol = '󰋜 ~'
read_only_style = '#eb6f92' # Rose Pine love
read_only = '  '
format = '[$path]($style)[$read_only]($read_only_style) '

[directory.substitutions]
'Documents' = '󰈙'
'Downloads' = ' '
'Music' = ' '
'Pictures' = ' '

# Shows current git branch
[git_branch]
symbol = ' '
format = '[$symbol$branch]($style)'
style = 'bold #9ccfd8' # Rose Pine foam

# Shows current git status
[git_status]
format = '[ \($all_status$ahead_behind\)]($style)'
style = 'bold #9ccfd8' # Rose Pine foam
conflicted = '[ conf=${count}](#eb6f92) '
up_to_date = '[󰘽](#9ccfd8) '
untracked = '[󰋗 unt=${count}](#eb6f92) '
ahead = ' ${count}'
diverged = ' ${ahead_count}  ${behind_count}'
behind = ' ${count}'
stashed = '[ stash=${count}](#9ccfd8) '
modified = '[󰛿 mod=${count}](#f6c177) '
staged = '[󰐗 sta=${count}](#9ccfd8) '
renamed = '[󱍸 ren=${count}](#f6c177) '
deleted = '[󰍶 del=${count}](#eb6f92) '

[fill]
symbol = ' '

# Shows kubernetes context and namespace
[kubernetes]
format = '[󱃾 $context\($namespace\)](bold #c4a7e7) ' # Rose Pine iris
disabled = false

# ---

[helm]
symbol = ' '
style = '#3e8fb0' # Rose Pine pine


[python]
style = '#9ccfd8' # Rose Pine foam
symbol = ' '
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
pyenv_version_name = true
pyenv_prefix = ''


[nodejs]
style = '#3e8fb0' # Rose Pine pine
symbol = ' '

[golang]
style = '#3e8fb0' # Rose Pine pine
symbol = ' '

[gcloud]
style = ''
symbol = '󱇶 '
format = '[$symbol$account(\($region\))(\[$project\] )]($style)'

[terraform]
symbol = ' '

[package]
symbol = '󰏗 '

[docker_context]
symbol = ' '
style = 'fg:#3e8fb0'
format = '[$symbol]($style) $path'
detect_files = ['docker-compose.yml', 'docker-compose.yaml', 'Dockerfile']
detect_extensions = ['Dockerfile']

[jobs]
symbol = ' '
style = '#eb6f92' # Rose Pine love
number_threshold = 1
format = '[$symbol]($style)'

[cmd_duration]
min_time = 500
style = 'fg:#6e6a86' # Rose Pine muted
format = '[$duration]($style)'
